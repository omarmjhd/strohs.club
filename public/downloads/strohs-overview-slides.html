<h2 id="the-path-to-nationals">The Path to Nationals</h2>
<div class="cols">
<div>
<ul>
<li>Our <strong>four qualifiers</strong> feed our <strong>Roost Regional team</strong>.</li>
<li>We play <strong>Big Plex (DFW)</strong> &amp; <strong>Supercell (OK)</strong> at <strong>Roost Regionals</strong> in the <strong>Texahoma Region</strong>.</li>
