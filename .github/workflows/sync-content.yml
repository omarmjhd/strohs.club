name: Sync content from Google Drive

# Pulls every component registered in content-sources.json, commits the ones that changed,
# and rebuilds the site. Does nothing at all until a source is registered.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Pull from Google Drive
        run: npm run sync

      # A Google edit is no more trusted than a git one: a file that fails the content check
      # is never committed, so the live site keeps serving the last good version.
      - name: Check the result
        run: npm run check

      - id: commit
        name: Commit anything that changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain content)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'strohs-bot'
          git config user.email 'strohs-bot@users.noreply.github.com'
          git add content
          # Name the components that changed. Every sync otherwise lands as an identical
          # message, which makes `git log` useless for spotting when a page last moved.
          changed=$(git diff --cached --name-only | sed 's#^content/##;s#\.md$##' | paste -sd', ' -)
          git commit -m "Sync ${changed} from Google Drive" \
            -m "Generated by the hourly sync. The source of truth is the Google file named in
          each file's header; editing the markdown directly is overwritten on the next run."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger deploy.yml's own push event, so call it.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
